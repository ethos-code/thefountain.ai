<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOUNTAIN® — the world's most beautiful AI pen</title>
<meta name="description" content="FOUNTAIN® is an AI writing instrument with augmented reality, LiDAR sensing, and gesture recognition.">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="FOUNTAIN®">
<meta property="og:description" content="The world's most beautiful AI pen.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f4f4f1;
    --paper: #0a0a0a;
    --margin: clamp(20px, 4vw, 48px);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: geometricPrecision;
    overscroll-behavior: none;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    position: relative;
  }

  .stage {
    position: absolute;
    inset: 0;
  }

  .stage iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: var(--paper);
  }

  .ui {
    position: absolute;
    inset: 0;
    pointer-events: none;
    padding: var(--margin);
    display: grid;
    grid-template-rows: auto 1fr auto;
    z-index: 2;
    opacity: 0;
    animation: fade 1000ms ease-out 200ms forwards;
  }

  .ui > * > * { pointer-events: auto; }

  @keyframes fade {
    to { opacity: 1; }
  }

  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 24px;
  }

  .wordmark {
    font-size: clamp(15px, 1.4vw, 17px);
    font-weight: 500;
    letter-spacing: 0.22em;
    line-height: 1;
  }

  .wordmark sup {
    font-size: 0.5em;
    font-weight: 400;
    margin-left: 0.12em;
    vertical-align: super;
    opacity: 0.6;
  }

  .status {
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    opacity: 0.5;
    line-height: 1;
    text-align: right;
  }

  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 32px;
  }

  .tagline {
    margin: 0;
    font-size: clamp(20px, 2.6vw, 30px);
    font-weight: 300;
    letter-spacing: -0.014em;
    line-height: 1.1;
    max-width: 22ch;
  }

  .tagline em {
    font-style: italic;
    font-weight: 400;
  }

  .actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 16px;
    min-width: 0;
  }

  .signup {
    display: flex;
    align-items: center;
    gap: 0;
    border-bottom: 1px solid color-mix(in oklab, var(--ink) 28%, transparent);
    transition: border-color 200ms ease;
    width: clamp(220px, 28vw, 300px);
  }

  .signup:focus-within {
    border-bottom-color: var(--ink);
  }

  .signup input[type="email"] {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    letter-spacing: 0.01em;
    padding: 8px 0;
    outline: none;
  }

  .signup input[type="email"]::placeholder {
    color: color-mix(in oklab, var(--ink) 45%, transparent);
  }

  .signup input[type="email"]:-webkit-autofill {
    -webkit-text-fill-color: var(--ink);
    box-shadow: 0 0 0 30px var(--paper) inset;
    transition: background-color 9999s ease-out;
  }

  .signup button {
    background: transparent;
    border: 0;
    color: var(--ink);
    font: inherit;
    font-size: 14px;
    padding: 8px 0 8px 12px;
    cursor: pointer;
    line-height: 1;
    opacity: 0.55;
    transition: opacity 200ms ease, transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .signup button:hover,
  .signup button:focus-visible {
    opacity: 1;
    transform: translateX(2px);
    outline: none;
  }

  .signup button[disabled] {
    opacity: 0.3;
    cursor: default;
  }

  .signup-msg {
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.7;
    line-height: 1.4;
    min-height: 14px;
    text-align: right;
    width: clamp(220px, 28vw, 300px);
  }

  .signup-msg[data-state="error"] { opacity: 1; color: #ff7d6e; }
  .signup-msg[data-state="success"] { opacity: 0.85; }

  .case-link {
    color: var(--ink);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 0.04em;
    border-bottom: 1px solid color-mix(in oklab, var(--ink) 28%, transparent);
    padding-bottom: 2px;
    transition: border-color 200ms ease, transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
    line-height: 1.4;
    white-space: nowrap;
    display: inline-block;
  }

  .case-link:hover,
  .case-link:focus-visible {
    border-bottom-color: var(--ink);
    transform: translateX(2px);
    outline: none;
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 720px) {
    .bottom {
      flex-direction: column;
      align-items: flex-start;
      gap: 28px;
    }
    .actions {
      align-items: flex-start;
      width: 100%;
    }
    .signup, .signup-msg { width: 100%; }
    .signup-msg { text-align: left; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ui { animation: none; opacity: 1; }
    .case-link { transition: border-color 200ms ease; }
    .case-link:hover { transform: none; }
  }
</style>
</head>
<body>
  <div class="stage">
    <iframe
      src="https://my.spline.design/fountainclean-sBz7vvQkxCKWDeB5BG1KqRUQ/"
      title="FOUNTAIN — interactive 3D rendering"
      allow="autoplay; fullscreen; xr-spatial-tracking"
      loading="eager"></iframe>
  </div>

  <div class="ui">
    <header class="top">
      <div class="wordmark">FOUNTAIN<sup>®</sup></div>
      <div class="status">In development<br>MMXXVI</div>
    </header>

    <div></div>

    <footer class="bottom">
      <p class="tagline">The world&rsquo;s most<br>beautiful AI pen.</p>
      <div class="actions">
        <form class="signup" id="signup" action="https://formspree.io/f/REPLACE_WITH_YOUR_FORM_ID" method="POST" novalidate>
          <label for="signup-email" class="visually-hidden">Email address</label>
          <input id="signup-email" type="email" name="email" placeholder="email" autocomplete="email" required>
          <input type="hidden" name="_subject" value="FOUNTAIN waitlist signup">
          <button type="submit" aria-label="Join the waitlist">&rarr;</button>
        </form>
        <div class="signup-msg" aria-live="polite"></div>
        <a class="case-link" href="https://www.behance.net/gallery/109944535/FOUNTAIN-The-worlds-most-beautiful-AI-pen" rel="noopener">Read the case study &rarr;</a>
      </div>
    </footer>
  </div>

  <script>
    (() => {
      const form = document.getElementById('signup');
      const msg = form.parentElement.querySelector('.signup-msg');
      const input = form.querySelector('input[type="email"]');
      const button = form.querySelector('button');
      const OWNER = 'j@mcginn.co';

      const setMsg = (text, state) => {
        msg.textContent = text;
        if (state) msg.setAttribute('data-state', state);
        else msg.removeAttribute('data-state');
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = input.value.trim();
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          setMsg('Enter a valid email.', 'error');
          input.focus();
          return;
        }

        const action = form.getAttribute('action') || '';
        const isPlaceholder = action.includes('REPLACE_WITH_YOUR_FORM_ID');

        if (isPlaceholder) {
          const subject = encodeURIComponent('FOUNTAIN waitlist');
          const body = encodeURIComponent(`Add me to the FOUNTAIN waitlist:\n\n${email}`);
          window.location.href = `mailto:${OWNER}?subject=${subject}&body=${body}`;
          setMsg('Opening your mail app — please send to confirm.', 'success');
          return;
        }

        button.disabled = true;
        setMsg('Sending…');
        try {
          const res = await fetch(action, {
            method: 'POST',
            body: new FormData(form),
            headers: { 'Accept': 'application/json' }
          });
          if (res.ok) {
            form.style.display = 'none';
            setMsg('Thanks — you’re on the list.', 'success');
          } else {
            setMsg('Something went wrong. Try again?', 'error');
            button.disabled = false;
          }
        } catch (err) {
          setMsg('Network error. Try again?', 'error');
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
